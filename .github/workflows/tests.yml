# The tests and the check of the catalog, at each push and pull request,
# on the oldest Python 42pal supports and a recent one.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: clang as cc, and valgrind, like on the campus machines
        run: |
          sudo apt-get update
          sudo apt-get install -y clang valgrind
          mkdir -p "$HOME/bin"
          ln -s "$(command -v clang)" "$HOME/bin/cc"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: tests
        run: python -m unittest
      - name: every reference solution against its oracle
        run: ./42pal check-catalog
